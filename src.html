<meta charset="utf-8">
<title>Come nasce una cucina RiFRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap">
<style>
:root{
  color-scheme: light;
  /* token del design system RiFRA, estratti da rifra.com il 29/09/2026 (DESIGN-SYSTEM.md) */
  --rf-black:#000;
  --rf-white:#fff;
  --rf-accent:#a8a6a1;      /* grigio caldo, accento del sito */
  --rf-light:#dfe0e1;       /* grigio chiaro, pulsante chiaro */
  --rf-dark:#38383b;        /* antracite, velature scure */
  --paper:#f5f4f1;          /* fondo pagina: bianco caldo, non abbaglia in fiera */
  --surface:#ffffff;
  --text:#000;
  --text-2:rgba(0,0,0,.68);
  --border-light:rgba(0,0,0,.10);
  --border-medium:rgba(0,0,0,.22);
  --shadow-card:0 4px 24px rgba(0,0,0,.07);
  --shadow-product:0 10px 40px rgba(0,0,0,.12);
  --shadow-floating:0 20px 60px rgba(0,0,0,.2);
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --display:"Instrument Serif",Georgia,serif;
  --serif:"Newsreader",Georgia,serif;
  --sans:"Helvetica Neue",Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

.mast{position:absolute;left:16px;top:12px;background:rgba(245,244,241,.92);padding:10px 18px 12px 16px;border-radius:4px;pointer-events:none;max-width:min(620px,calc(100% - 32px))}
.sr{position:absolute;width:1px;height:1px;margin:-1px;border:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mast h1{margin:0;font:400 clamp(30px,3.6vw,52px)/1.05 var(--display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
.mast p{margin:6px 0 0;font:400 15px/1.35 var(--serif);color:var(--text-2);letter-spacing:.02em}

.card{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100% - 32px));background:var(--surface);border-radius:4px;box-shadow:var(--shadow-product);padding:20px 22px 18px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.eyebrow{font:400 14px/1 var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);display:flex;gap:8px;align-items:baseline}
.eyebrow b{font:400 28px/1 var(--display);color:var(--text);letter-spacing:0}
.card h2{margin:0;font:400 30px/1.1 var(--display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
.data{margin:0;font:400 14px/1.4 var(--serif);letter-spacing:.02em;color:var(--text);background:var(--rf-light);border-radius:30px;padding:4px 12px;align-self:flex-start}
.body{margin:0;font:400 16px/1.5 var(--serif);color:var(--text-2);max-width:62ch}
.bar{height:2px;background:var(--border-light);overflow:hidden;position:relative;margin-top:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--rf-black)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ctrl button,.index button,.motion{font:400 15px/1 var(--serif);letter-spacing:.02em;color:var(--text);background:var(--rf-light);border:0;padding:11px 18px;min-height:40px;cursor:pointer;border-radius:30px;transition:background-color .2s var(--ease-out-expo),color .2s var(--ease-out-expo)}
.motion{position:absolute;right:16px;top:14px}
.stylebtn{top:62px}
#motion[aria-pressed="true"]{background:var(--rf-black);color:var(--rf-white)}
.ctrl button:active,.index button:active,.motion:active{transform:scale(.97)}
.fx.in{animation:fxIn .45s var(--ease-out-expo)}
@keyframes fxIn{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (pointer:coarse){.ctrl button,.index button,.motion{min-height:44px;min-width:44px}}
.ctrl button:hover,.index button:hover,.motion:hover{background:#d0d1d3}
.ctrl button.primary{background:var(--rf-black);color:var(--rf-white)}
.ctrl button.primary:hover{background:var(--rf-dark)}
.ctrl button[aria-pressed="true"]{background:var(--rf-black);color:var(--rf-white)}
#more{display:none}
button:focus-visible{outline:3px solid var(--rf-black);outline-offset:2px;box-shadow:0 0 0 6px var(--paper)}
#play{min-width:150px}
#scene.hot{cursor:pointer}
@media (forced-colors:active){.index button[aria-current]{outline:2px solid CanvasText}}

.index{position:absolute;right:16px;bottom:16px;left:430px;display:flex;justify-content:flex-end;pointer-events:none}
.index ol{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;max-width:100%}
.index button{padding:8px 14px;display:flex;gap:6px;align-items:center;font-size:14px;min-height:36px;color:var(--text);background:rgba(255,255,255,.94);box-shadow:inset 0 0 0 1px var(--border-medium)}
.index button b{font:400 17px/1 var(--display)}
.index button[aria-current="step"]{background:var(--rf-black);color:var(--rf-white);box-shadow:none}

/* segnaposto numerati sopra i reparti (tavola intera): bersagli veri, non scritte a terra */
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:0;background:var(--rf-black);color:var(--rf-white);font:400 19px/38px var(--display);text-align:center;padding:0;cursor:pointer;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .2s var(--ease-out-expo)}
.pin:hover,.pin.hot{transform:scale(1.12)}
@media (pointer:coarse){.pin{width:44px;height:44px;margin:-22px 0 0 -22px;line-height:44px}}
.kiosk .pin{width:56px;height:56px;margin:-28px 0 0 -28px;line-height:56px;font-size:26px}

@media (max-width:899px){
  .mast p{display:none}
  .hint{display:none}
  .card{padding:14px 16px 14px;gap:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .motion{top:10px;right:12px;padding:6px 12px}
  .stylebtn{top:60px}
  .mast{max-width:calc(100% - 150px)}
  .card h2{font-size:24px}
  .body{font-size:14px;line-height:1.45}
  .index{left:16px;right:16px;bottom:calc(var(--card-h,300px) + 20px)}
  .mast h1{font-size:26px}
  .mast{padding:8px 12px}
  .index button span{display:none}
  .index ol{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;overflow:visible}
  .index button{justify-content:center}
  #more{display:inline-block}
  .card:not(.open) .body{display:none}
}
.caption{position:absolute;margin:0;padding:10px 18px;background:rgba(255,255,255,.96);border-radius:4px;box-shadow:var(--shadow-card);font:400 20px/1.35 var(--serif);color:var(--text);text-align:center;text-wrap:balance;pointer-events:none;max-width:min(760px,calc(100% - 32px));box-sizing:border-box}
.kband{position:absolute;right:16px;top:14px;display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:4px;box-shadow:var(--shadow-product);padding:12px 20px 12px 12px}
.kband .qr svg{width:120px;height:120px;display:block}
.kband b{display:block;font:400 26px/1.1 var(--display);letter-spacing:-.02em;color:var(--text)}
.kband span{display:block;font:400 15px/1.4 var(--serif);color:var(--text-2);margin-top:6px}
.tapcta{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 22px/1 var(--serif);letter-spacing:.02em;color:var(--rf-white);background:var(--rf-black);border:0;border-radius:30px;padding:24px 40px;box-shadow:var(--shadow-floating);cursor:pointer;animation:ctaPulse 2.4s ease-in-out infinite}
@keyframes ctaPulse{50%{transform:translate(-50%,-50%) scale(1.04)}}
.kiosk .mast,.kiosk .card,.kiosk .index,.kiosk .motion,.kiosk .caption,.kiosk .kband,.kiosk .tapcta{zoom:var(--k,1)}
.kiosk .card .body,.kiosk #voice,.kiosk #more,.kiosk .stylebtn{display:none}
.kiosk .kband{top:auto;bottom:16px;right:16px}
.kiosk .index{bottom:auto;top:14px;left:auto;right:16px;max-width:640px}
.kiosk .mast h1{font-size:44px}
.kiosk .index button{padding:8px 12px}
.kiosk .motion{top:auto;bottom:170px}
.kiosk,.kiosk *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.kiosk body{touch-action:none;overscroll-behavior:none}
.kiosk button{touch-action:manipulation;min-height:56px}
.video .ctrl,.video .index,.video .motion,.video .tapcta,.video #voice,.video #more,.video .bar,.video #pins{display:none!important}
.video .fx.in{animation:none}
.video .kband{top:auto;bottom:16px;right:16px}
.video .caption{font-size:30px;max-width:1040px}
/* video su schermo grande: QR da ~15 cm su un 65" */
.video .kband{padding:14px 22px 14px 14px;gap:20px}.video .kband .qr svg{width:216px;height:216px}.video .kband b{font-size:36px}.video .kband span{font-size:20px}
@media (max-height:560px){ .card:not(.open) .body{display:none} #more{display:inline-block} .card.open{max-height:calc(100dvh - 24px);overflow:auto} }
@media (max-height:560px) and (orientation:landscape){
  .mast h1{font-size:20px} .mast p{display:none}
  .card{width:min(340px,46vw);max-height:calc(100dvh - 16px);overflow:auto;bottom:8px;gap:4px;padding:10px 12px}
  .card h2{font-size:20px}
  .index{left:calc(min(340px,46vw) + 28px);right:8px;bottom:8px;top:auto}
  .index ol{display:flex!important;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
}
.mast{left:max(16px,env(safe-area-inset-left,0px))}.card{left:max(16px,env(safe-area-inset-left,0px))}
.index,.motion{right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){ .tapcta{animation:none} .fx.in{animation:none} .ctrl button:active,.index button:active{transform:none} .pin{transition:none} }
</style>

<script>
(()=>{
'use strict';
/* ---------- inchiostri ---------- */
// Scena: stile «plastico» a colori pieni (principale) o «matita» risograph (alternativa).
// L'interfaccia usa il design system RiFRA (DESIGN-SYSTEM.md); la scena usa i colori veri della fabbrica.
const PAPER='#f4f2ed';
const INK={ink:'#2a2b2f',wood:'#b8864f',green:'#4e9a3a',blue:'#3f7fbd',gold:'#e1ad2c',red:'#c2412f'};
const ANG={ink:45,wood:15,green:75,blue:105,gold:0,red:30};
const REG={ink:[0,0],wood:[.7,-.45],green:[-.55,.5],blue:[.45,.6],gold:[-.4,-.5],red:[.5,.3]};
const TONES=[.1,.22,.4,.6];
const DOT=3.3;
const LW=.9;
const TAU=Math.PI*2;
const U=16, CS=Math.cos(Math.PI/6), SN=.5;
const P=(x,y,z=0)=>[(x-y)*CS*U,(x+y)*SN*U-z*U];
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const KIOSK=/[?&]kiosk\b/.test(location.search);
const VIDEO=/[?&]video\b/.test(location.search),VIDEOPEN=/[?&]video=matita\b/.test(location.search);
const RM=!KIOSK&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,PAT={},GRAIN=null;

function buildPatterns(){
  PAT={};
  for(const k in INK){
    PAT[k]=TONES.map(tn=>{
      const R=48,c=document.createElement('canvas');c.width=c.height=R;
      const g=c.getContext('2d');g.fillStyle=INK[k];
      g.beginPath();g.arc(R/2,R/2,R*Math.sqrt(tn/Math.PI),0,TAU);g.fill();
      const p=ctx.createPattern(c,'repeat');
      p.setTransform(new DOMMatrix().rotateSelf(ANG[k]).scaleSelf(DOT/R));
      return p;
    });
  }
  const g=document.createElement('canvas');g.width=g.height=256;
  const gx=g.getContext('2d');const im=gx.createImageData(256,256);
  for(let i=0;i<im.data.length;i+=4){const v=235+Math.random()*20|0;im.data[i]=v;im.data[i+1]=v-1;im.data[i+2]=v-4;im.data[i+3]=255}
  gx.putImageData(im,0,0);
  GRAIN=ctx.createPattern(g,'repeat');
}
let FLAT=false;const RGB={};for(const k in INK){const h=INK[k];RGB[k]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}

function kf(c,keys){

    if(c<=t1){const u=t1>t0?easeW((c-t0)/(t1-t0)):1;return lerp(v0,v1,u)}}

 ['Il bordo','Bordatrice Brandt · levigabordi De Stefani',"Il pannello scorre lungo la bordatrice, che applica il bordo sul fianco. Poi la levigabordi rifinisce gli spigoli, pronti per la finitura."],
 ['Levigato prima della lacca','Levigatrice a nastro largo',"Prima della verniciatura ogni superficie passa nella levigatrice. Le condotte zincate portano la polvere ai filtri e al silo nel cortile dietro al capannone."],
 ['Laccato in casa','Robot Cefla Spraybotic · opachi, lucidi, legno',"La laccatura si fa all'interno: colori opachi, colori lucidi e finiture legno. Il robot di spruzzatura Cefla stende la vernice sui pannelli che scorrono sotto la testa rotante. RiFRA vernicia con un impianto robotizzato dal 1995."],
 ['Asciugato e lucidato','Carrelli di essiccazione · reparto lucidatura',"Le ante verniciate riposano sui carrelli di essiccazione a bracci. Nel reparto di carteggiatura e lucidatura le superfici vengono rifinite."],
 ['Il montaggio','Strettoio Erregi · linea di montaggio',"Fianchi, ripiani e schienali diventano una scocca: lo strettoio la tiene in squadra mentre la colla fa presa. Poi la linea di montaggio aggiunge ferramenta e ante; superfici, giunzioni e meccanismi si provano uno a uno."],
 ['Pronta per la casa','Imballaggio · avvolgitore Robopac',"Gli elementi finiti vengono protetti, raccolti su bancale e avvolti nel film. Dal magazzino partono verso la casa del cliente, dove la squadra RiFRA si occupa di consegna e montaggio."],
];
const INTRO={num:'12',phase:'passaggi · un solo capannone',title:'Dal pannello alla cucina',data:'Gerno di Lesmo · produzione in sede dal 1977',body:"Questa tavola ricostruisce la fabbrica RiFRA di Gerno di Lesmo dalla pianta e dalle foto dei reparti: un pannello grezzo diventa un'anta laccata e poi una cucina. Ogni macchina e ogni persona è disegnata dal codice."};
const OUTRO={num:'12',phase:'passaggi · fine del giro',title:'Dal pannello alla cucina',data:'12 passaggi · tutto in un unico capannone',body:"L'ordine dei reparti segue il percorso di un'anta ed è da confermare con RiFRA. Tocca un numero sulla tavola per tornare in un reparto, oppure rivedi il giro dall'inizio."};
// niente voce: i tempi dei reparti vengono dal numero di parole del testo
const CUES_R=(()=>{const out=[0];for(let i=0;i<12;i++){const words=(TXT[i][0]+' '+TXT[i][1]+' '+TXT[i][2]).split(/\s+/).length;out.push(out[i]+Math.max(11,words/3.0+4))}return out})();
const END_R=CUES_R[12];
const CUES_V=CUES_R,END_V=END_R;
const CUES_S=CUES_R.map((_,i)=>i*4.5),END_S=54;
let CUES=CUES_R,END=END_R;
function setTimeline(){CUES=CUES_R;END=END_R}

/* ---------- stato ---------- */
const $=id=>document.getElementById(id);
const audio=$('voce');
let motionOn=true,mode='sheet',playing=false,tc=0,cur=-1,voiceOn=false,interacted=false,ended=false;
const idx=$('idx');
NAMES.forEach((n,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${n}</span>`;b.setAttribute('aria-label',`Passaggio ${i+1}: ${n}`);b.onclick=()=>{interacted=true;jump(i,true)};li.appendChild(b);idx.appendChild(li)});
function setCard(c){const fx=document.querySelectorAll('#card .fx');fx.forEach(e=>{e.classList.remove('in');void e.offsetWidth;e.classList.add('in')});$('num').textContent=c.num;$('phase').textContent=c.phase;$('title').textContent=c.title;$('data').textContent=c.data;$('body').textContent=c.body}
function setStation(i){
  cur=i;const x=TXT[i];
  setCard({num:String(i+1).padStart(2,'0'),phase:`di 12 · ${NAMES[i]}`,title:x[0],data:x[1],body:x[2]});
  $('live').textContent=`Passaggio ${i+1} di 12: ${x[0]}`;labsFor=i;labsDone=false;
  [...idx.querySelectorAll('button')].forEach((b,k)=>k===i?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));
  requestAnimationFrame(()=>Object.assign(tgt,stationCam(i)));
}
function syncButtons(){
  $('play').textContent=mode==='tour'&&playing?'Pausa':mode==='sheet'?(ended?'Rivedi il giro':'Avvia il giro'):'Riprendi il giro';
  if(mode==='free')$('play').textContent='Torna al giro';
}
function play(){mode='tour';playing=true;syncButtons()}
function pause(){playing=false;syncButtons()}
function jump(i,autoplay){tc=CUES[i]+.01;ended=false;mode='tour';setStation(i);if(autoplay)play();else syncButtons()}
function goSheet(outro){mode='sheet';pause();$('live').textContent=outro?'Fine del giro':'Tavola intera';$('labs').innerHTML='';[...idx.querySelectorAll('button')].forEach(b=>b.removeAttribute('aria-current'));cur=-1;setCard(outro?OUTRO:INTRO);$('prog').style.width=outro?'100%':'0%';requestAnimationFrame(()=>Object.assign(tgt,sheetCam()));syncButtons()}
$('play').onclick=()=>{interacted=true;if(mode==='sheet'){jump(0,true)}else if(mode==='free'){if(cur<0)jump(0,true);else{setStation(cur);play()}}else playing?pause():play()};
$('next').onclick=()=>{interacted=true;jump(Math.min(11,Math.max(-1,cur)+1),mode==='sheet'||playing)};
$('prev').onclick=()=>{interacted=true;jump(Math.max(0,cur-1),mode==='sheet'||playing)};
function setStyle(solid){SOLID=solid;dirty=true;const b=$('style');b.textContent=solid?'Vista a matita':'Vista a colori';document.documentElement.classList.toggle('solid',solid);try{if(!VIDEO)localStorage.setItem('rf-stile',solid?'colori':'matita')}catch(e){}}
$('style').onclick=()=>{interacted=true;setStyle(!SOLID)};
if(!KIOSK&&!VIDEO){try{if(localStorage.getItem('rf-stile')==='matita')setStyle(false)}catch(e){}}
$('motion').onclick=()=>{interacted=true;motionOn=!motionOn;$('motion').setAttribute('aria-pressed',String(!motionOn));if(!motionOn&&playing)pause();dirty=true};
if(RM){$('motion').setAttribute('aria-pressed','true');$('motion').disabled=true;$('motion').title='Animazioni ridotte dalle impostazioni del sistema'}
$('sheet').onclick=()=>{interacted=true;goSheet(false)};
$('more').onclick=()=>{const o=$('card').classList.toggle('open');$('more').setAttribute('aria-expanded',String(o));$('more').textContent=o?'Riduci':'Leggi tutto'};
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();$('next').click()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();$('prev').click()}
  else if(e.key===' '||e.key==='b'){e.preventDefault();$('play').click()}else if(e.key==='Escape'||e.key==='s'){$('sheet').click()}
  else if(e.key==='r'&&KIOSK){kioskAttract()}
  else if(/^[0-9]$/.test(e.key)){kbuf+=e.key;clearTimeout(kbufT);kbufT=setTimeout(()=>{const n=+kbuf;kbuf='';if(n>=1&&n<=12){interacted=true;attract=false;jump(n-1,true)}},600)}});
let kbuf='',kbufT;

function updateTour(dt){
  if(mode!=='tour')return;
  if(playing)tc+=dt;
  if(tc>=END){ended=true;goSheet(true);if(KIOSK)kioskAfterEnd();return}
  let i=0;for(let k=0;k<12;k++)if(tc>=CUES[k])i=k;
  if(i!==cur)setStation(i);
  $('prog').style.width=clamp((tc-CUES[i])/((CUES[i+1]||END)-CUES[i]),0,1)*100+'%';
}

/* ---------- trascinamento e zoom ---------- */
const inert={x:0,y:0};let hoverBay=-1;
function zlim(){const s=sheetCamRaw();return[s*.8,4.5]}
function clampCam(){const b=bounds(SHEET);cam.x=clamp(cam.x,b[0],b[1]);cam.y=clamp(cam.y,b[2],b[3]);const [z0,z1]=zlim();cam.z=clamp(cam.z,z0,z1)}
// tappa sotto il puntatore: prisma della tappa (pavimento + 6 u), dal più vicino al più lontano
function bayAt(sx,sy){const wx=(sx-ax*W)/cam.z+cam.x,wy=(sy-ay*H)/cam.z+cam.y;
  const order=[...ST.keys()].sort((i,j)=>(ST[j].x+ST[j].y)-(ST[i].x+ST[i].y));
  for(const i of order){const q=hexOf6(ST[i],6);
    let inside=false;for(let a=0,b=q.length-1;a<q.length;b=a++){if((q[a][1]>wy)!==(q[b][1]>wy)&&wx<(q[b][0]-q[a][0])*(wy-q[a][1])/(q[b][1]-q[a][1])+q[a][0])inside=!inside}
    if(inside)return i}
  return -1}
const ptrs=new Map();let drag=null,moved=0,pinch0=null;
function toFree(){if(mode!=='free'){if(mode==='tour'&&playing)pause();mode='free';syncButtons()}}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;inert.x=inert.y=0;
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,t:performance.now(),lx:e.clientX,ly:e.clientY};
  if(ptrs.size===2&&!KIOSK){const [a,b]=[...ptrs.values()];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z,wx:(mx-ax*W)/cam.z+cam.x,wy:(my-ay*H)/cam.z+cam.y};drag=null}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(KIOSK){if(drag)moved=Math.max(moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));return}
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;const [z0,z1]=zlim();const nz=clamp(pinch0.z*d/pinch0.d,z0,z1);
    cam.z=tgt.z=nz;cam.x=tgt.x=pinch0.wx-(mx-ax*W)/nz;cam.y=tgt.y=pinch0.wy-(my-ay*H)/nz;clampCam();moved=99;toFree();dirty=true;return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));const th=e.pointerType==='touch'?10:5;
    if(moved>th){toFree();cv.classList.add('dragging');cam.x=tgt.x=drag.cx-dx/cam.z;cam.y=tgt.y=drag.cy-dy/cam.z;clampCam();dirty=true;
      const n=performance.now(),dtp=Math.max(1,n-drag.t)/1000;inert.x=-(e.clientX-drag.lx)/cam.z/dtp;inert.y=-(e.clientY-drag.ly)/cam.z/dtp;drag.t=n;drag.lx=e.clientX;drag.ly=e.clientY}}});
cv.addEventListener('pointermove',e=>{if(ptrs.size||e.pointerType!=='mouse')return;const b=bayAt(e.clientX,e.clientY);if(b!==hoverBay){hoverBay=b;cv.classList.toggle('hot',b>=0);dirty=true}});
cv.addEventListener('pointerleave',()=>{if(hoverBay>=0){hoverBay=-1;cv.classList.remove('hot');dirty=true}});
const up=e=>{ptrs.delete(e.pointerId);cv.classList.remove('dragging');
  if(ptrs.size===1&&pinch0){const [p]=[...ptrs.values()];drag={x:p[0],y:p[1],cx:cam.x,cy:cam.y,t:performance.now(),lx:p[0],ly:p[1]};pinch0=null;moved=99;return}
  if(ptrs.size===0){const th=e.pointerType==='touch'?10:5;if(drag&&moved<=th){inert.x=inert.y=0;clickAt(e.clientX,e.clientY)}else if(performance.now()-(drag?drag.t:0)>90){inert.x=inert.y=0}drag=null;pinch0=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();if(KIOSK)return;interacted=true;toFree();dirty=true;inert.x=inert.y=0;
  const unit=e.deltaMode===1?16:e.deltaMode===2?H:1,dx=e.deltaX*unit,dy=e.deltaY*unit;
  const isPan=!e.ctrlKey&&e.deltaMode===0&&(Math.abs(dx)>0||Math.abs(dy)<40);
  if(isPan){cam.x=tgt.x=cam.x+dx/cam.z;cam.y=tgt.y=cam.y+dy/cam.z;clampCam();drag=null;return}
  const k=Math.exp(-dy*(e.ctrlKey?.01:.0015));
  const wx=(e.clientX-ax*W)/cam.z+cam.x,wy=(e.clientY-ay*H)/cam.z+cam.y;const [z0,z1]=zlim();const nz=clamp(cam.z*k,z0,z1);
  cam.z=tgt.z=nz;cam.x=tgt.x=wx-(e.clientX-ax*W)/nz;cam.y=tgt.y=wy-(e.clientY-ay*H)/nz;clampCam();drag=null},{passive:false});
function clickAt(sx,sy){interacted=true;if(KIOSK&&attract){kioskStory(0);return}
  const i=bayAt(sx,sy);if(i<0)return;
  if(mode==='tour'&&i===cur){if(!playing)play();return}
  jump(i,true)}

/* ---------- ciclo ---------- */
function resize(){dirty=true;W=cv.clientWidth;H=cv.clientHeight;DPR=Math.min(2,devicePixelRatio||1,Math.sqrt(4.2e6/Math.max(1,W*H)));
  if(KIOSK){const K=clamp(Math.min(W/1280,H/720),1,3);document.documentElement.style.setProperty('--k',K);LK=K*1.5}placeCaption();cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(!Object.keys(PAT).length)buildPatterns();
  const t=mode==='sheet'?sheetCam():cur>=0&&mode==='tour'?stationCam(cur):null;if(t){Object.assign(tgt,t);if(!started)Object.assign(cam,t)}}
let last=performance.now(),lastReal=last,started=false,dirty=true;const CV={x:0,y:0,lz:0};
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;if(!RM&&motionOn&&!(mode==='tour'&&!playing))T+=dt;
  updateTour(clamp((now-lastReal)/1000,0,1));lastReal=now;
  if(mode!=='free'){
    if(RM){cam.x=tgt.x;cam.y=tgt.y;cam.z=tgt.z}
    else{
      // volo esce-sposta-rientra: se la meta è lontana, lo zoom obiettivo scende finché partenza e arrivo stanno nell'inquadratura
      const far=Math.hypot(tgt.x-cam.x,tgt.y-cam.y),zFit=Math.min(W,H)*.75/Math.max(1,far);
      const zGoal=Math.min(tgt.z,Math.max(zFit,zlim()[0]*1.1));
      [cam.x,CV.x]=damp(cam.x,tgt.x,CV.x,.55,dt);[cam.y,CV.y]=damp(cam.y,tgt.y,CV.y,.55,dt);let lz;[lz,CV.lz]=damp(Math.log(cam.z),Math.log(zGoal),CV.lz,.4,dt);cam.z=Math.exp(lz)}
  }else{
    if(!ptrs.size&&(Math.abs(inert.x)+Math.abs(inert.y)>.5)){cam.x+=inert.x*dt;cam.y+=inert.y*dt;const f=Math.exp(-dt*5);inert.x*=f;inert.y*=f;clampCam();tgt.x=cam.x;tgt.y=cam.y;dirty=true}
  }
  camMoving=Math.abs(tgt.x-cam.x)*cam.z+Math.abs(tgt.y-cam.y)*cam.z>.4||Math.abs(Math.log(tgt.z/cam.z))>.002;
  const anim=!RM&&motionOn&&!(mode==='tour'&&!playing);
  const veilDirty=Math.abs(VEIL-(focusStation()>=0?1:0))>.004;
  if(anim||camMoving||dirty||veilDirty||ptrs.size||!started){draw();dirty=false}started=true;if(!VIDEO)requestAnimationFrame(frame);
}
addEventListener('resize',resize);
const cardEl=$('card');const setCH=()=>{document.documentElement.style.setProperty('--card-h',cardEl.offsetHeight+'px')};setCH();
try{new ResizeObserver(()=>{setCH();const t=mode==='sheet'?sheetCam():cur>=0&&mode==='tour'?stationCam(cur):null;if(t)Object.assign(tgt,t)}).observe(cardEl)}catch(e){}
setCard(INTRO);
resize();Object.assign(tgt,sheetCam());Object.assign(cam,tgt);syncButtons();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>resize());
if(document.fonts&&document.fonts.load)Promise.all(['400 20px "Instrument Serif"','400 20px Newsreader'].map(f=>document.fonts.load(f))).then(()=>resize()).catch(()=>{});
try{new ResizeObserver(()=>resize()).observe(cv)}catch(e){}
if(!VIDEO)requestAnimationFrame(frame);
/* ---------- sottotitoli: nessuna voce per ora, la scheda porta il testo ---------- */
const capEl=$('caption');
function placeCaption(){const capEl=document.getElementById('caption');if(!capEl)return;const f=FREE;
  capEl.style.top='auto';capEl.style.left=(f.x0+8)+'px';capEl.style.right=Math.max(8,innerWidth-f.x1+8)+'px';capEl.style.marginInline='auto';
  capEl.style.bottom=Math.max(8,innerHeight-f.y1+8)+'px'}
function updateCaption(){if(!capEl.hidden)capEl.hidden=true}
/* ---------- modalità fiera (?kiosk=1) ---------- */
let attract=false,lastInput=performance.now(),kioskTimer=null;
function kioskAttract(){attract=true;clearTimeout(kioskTimer);motionOn=true;$('motion').setAttribute('aria-pressed','false');
  setStyle(true);CUES=CUES_S;END=END_S;$('tapcta').hidden=false;jump(0,true)}
function kioskStory(i){attract=false;clearTimeout(kioskTimer);$('tapcta').hidden=true;CUES=CUES_R;END=END_R;jump(i,true);lastInput=performance.now()}
function kioskAfterEnd(){clearTimeout(kioskTimer);$('kband').hidden=false;kioskTimer=setTimeout(kioskAttract,attract?9000:14000)}
if(VIDEO){
  // 3 s di apertura sulla tavola, poi il giro sui tempi di lettura, poi 8 s di chiusura con il QR
  document.documentElement.classList.add('video');interacted=true;setStyle(!VIDEOPEN);
  let vt=0,vnow=0;const INTRO_S=3;
  window.__video={duration:INTRO_S+END_R+8,intro:INTRO_S,step(dt){vt+=dt;vnow+=dt*1000;
    if(vt>=INTRO_S&&mode==='sheet'&&!ended)jump(0,true);
    if(ended&&$('kband').hidden)$('kband').hidden=false;
    frame(vnow);return vt}};
  frame(0);
}else if(KIOSK){
  document.documentElement.classList.add('kiosk');$('kband').hidden=false;
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastInput=performance.now()},{capture:true,passive:true}));
  addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&/^[=+\-0psPS]$/.test(e.key))e.preventDefault()});
  $('tapcta').onclick=()=>kioskStory(0);
  setInterval(()=>{if(!attract&&performance.now()-lastInput>45000&&!(mode==='tour'&&playing))kioskAttract()},2000);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  addEventListener('error',()=>setTimeout(()=>location.reload(),5000));
  setTimeout(kioskAttract,400);
}else{['keydown','focusin','touchstart'].forEach(t=>addEventListener(t,()=>{interacted=true},{once:true,passive:true}));if(!RM)setTimeout(()=>{if(!interacted&&mode==='sheet'&&!document.hidden)jump(0,true)},12000)}
})();
